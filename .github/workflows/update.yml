name: Aggiorna annunci

on:
  workflow_dispatch:
  # schedule:
  #   - cron: "37 5 * * *"

permissions:
  contents: write

concurrency:
  group: aggiorna-annunci
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa dipendenze
        run: pip install -r scraper/requirements.txt
        
        - name: Test delle regole di classificazione
          run: |
            pip install pytest
            if [ -d tests ]; then python -m pytest -q tests; else echo "Cartella tests assente: test saltati"; fi
           
      - name: Leggi le fonti
        env:
          JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
        run: python scraper/run.py

      - name: Salva i risultati
        run: |
          git config user.name "cpp-job-radar bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || git commit -m "Aggiorna annunci $(date -u +%Y-%m-%d)"
          git push
